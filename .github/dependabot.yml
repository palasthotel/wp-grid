---
# Generated by palasthotel/github-workflows (dependabot/bin/generate.sh). Change the
# template there and regenerate, not this file - the PR checks warn when it differs.
# See https://github.com/palasthotel/github-workflows/blob/main/docs/dependabot.md
version: 2

updates:

  - package-ecosystem: "composer"
    directory: "/public"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      exclude:
        - "palasthotel/*"
    groups:
      composer:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      composer-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      exclude:
        - "palasthotel/*"
    groups:
      github-actions:
        patterns:
          - "*"
